name: Test invalid Orca token produces a failing scan with exit_code output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: invalid-orca-api-token
          project_key: test-project
          path: "."
          show_annotations: "false"
          disable_err_report: "true"
          no_color: "true"
          timeout: "2m"
      - name: Assert scan ran and failed on the invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid token, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" = "0" ]; then
            echo "FAIL: exit_code output should be non-zero"
            exit 1
          fi
          echo "PASS"
