name: Test scan tuning options are accepted and scan runs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare log directory
        run: mkdir -p "$GITHUB_WORKSPACE/orca-logs"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: invalid-orca-token-for-testing
          project_key: test-project
          path: "."
          exit_code: "7"
          max_secret: "50"
          num_cpu: "2"
          exceptions_filepath: hardened/tests/fixtures/orca-exceptions.yaml
          config: hardened/tests/fixtures/orca-config.yaml
          debug: "true"
          log_path: orca-logs
          disable_err_report: "true"
          no_color: "true"
          show_annotations: "false"
          timeout: "2m"
      - name: Assert scan was attempted and failed (invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an invalid Orca API token"
            exit 1
          fi
          if [ -n "$EXIT_CODE" ]; then
            if ! echo "$EXIT_CODE" | grep -qE '^[0-9]+$'; then
              echo "FAIL: exit_code output is not numeric"
              exit 1
            fi
            if [ "$EXIT_CODE" = "0" ]; then
              echo "FAIL: exit_code should be non-zero"
              exit 1
            fi
          fi
          echo "PASS"
