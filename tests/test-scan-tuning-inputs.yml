name: Test scan tuning inputs (config, exceptions, exit_code, log_path, max_secret, num_cpu)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare log directory
        run: mkdir -p "$GITHUB_WORKSPACE/orca-logs"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: invalid-orca-api-token
          project_key: test-project
          path: "."
          config: hardened/tests/fixtures/orca-config.yaml
          exceptions_filepath: hardened/tests/fixtures/exceptions.yaml
          exit_code: "3"
          log_path: orca-logs
          max_secret: "5"
          num_cpu: "2"
          debug: "true"
          show_annotations: "false"
          disable_err_report: "true"
          no_color: "true"
          timeout: "2m"
      - name: Assert scan ran with tuning inputs and failed on the invalid token
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid token, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" = "0" ]; then
            echo "FAIL: exit_code output should be non-zero"
            exit 1
          fi
          echo "PASS"
