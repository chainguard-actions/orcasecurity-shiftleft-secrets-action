name: Test commit range scan options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: sha
        name: Resolve HEAD sha
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          api_token: invalid-orca-token-for-testing
          project_key: test-project
          path: "."
          from_commit: ${{ steps.sha.outputs.head }}
          to_commit: ${{ steps.sha.outputs.head }}
          ignore_git_history_baseline: "true"
          disable_err_report: "true"
          no_color: "true"
          show_annotations: "false"
          timeout: "2m"
      - name: Assert scan was attempted and failed (invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit_code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit_code: $EXIT_CODE"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an invalid Orca API token"
            exit 1
          fi
          if [ -n "$EXIT_CODE" ]; then
            if ! echo "$EXIT_CODE" | grep -qE '^[0-9]+$'; then
              echo "FAIL: exit_code output is not numeric"
              exit 1
            fi
            if [ "$EXIT_CODE" = "0" ]; then
              echo "FAIL: exit_code should be non-zero"
              exit 1
            fi
          fi
          echo "PASS"
